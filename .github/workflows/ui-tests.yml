name: UI tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Chrome уже установлен на ubuntu-latest, драйвер под него Selenium скачает сам
      - name: Run UI tests in headless Chrome
        run: ./mvnw -B -ntp test -Dselenide.headless=true

      # отчёт строим и при упавших тестах — именно тогда он нужнее всего
      - name: Build Allure report
        if: ${{ !cancelled() }}
        run: ./mvnw -B -ntp allure:report

      - name: Upload Allure report as artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          if-no-files-found: warn

      - name: Upload Allure report for GitHub Pages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/site/allure-maven-plugin

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish Allure report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
